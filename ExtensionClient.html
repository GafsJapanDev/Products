
<script>

const extTabs=['棚卸','AI'];
let extOcrApplied=false,extOcrDate='',extPurchaseMode='simple',extOcrDraft=null,extContext=null,extInvoice=null,extStock=null,extOcrFiles=[],extUploadCache=[],extPending=null,extJournal={};
const extInvoiceDrafts={};
const extOriginalRender=render,extOriginalCapture=capture,extOriginalCurrent=current,extOriginalSave=save;
function extCaptureInvoice(){
 if(tab==='仕入'&&extInvoice&&extInvoice.date===activeDate){
  const r=extInvoiceInput(extInvoice.status||'confirmed');
  extInvoice={...extInvoice,...r,supplier:{name:r.supplier}};
  extInvoiceDrafts[activeDate]=structuredClone(extInvoice);
 }
}
capture=function(){if(!extTabs.includes(tab))extOriginalCapture();extCaptureInvoice();};
current=function(){const r=extOriginalCurrent();if(tab==='売上')r.journalFiles=extJournal[activeDate]||(day.売上?.[0]?.journalFiles||[]);return r;};
function extSyncPurchaseMode(){
 $('extSimplePurchase').hidden=extPurchaseMode!=='simple';
 $('extInvoicePanel').hidden=extPurchaseMode!=='invoice';
 $('extSimpleMode').setAttribute('aria-pressed',String(extPurchaseMode==='simple'));
 $('extInvoiceMode').setAttribute('aria-pressed',String(extPurchaseMode==='invoice'));
 if(tab==='仕入')$('save').textContent='仕入れを保存';
}
function extSetPurchaseMode(mode){
 if(busy)return;capture();extPurchaseMode=mode;extSyncPurchaseMode();
}
save=function(){
 if(busy)return;

 if(extReceiptQueue.some(r=>r.kind===(tab==='売上'?'journal':'invoice')&&['ready','confirmed','failed','duplicate'].includes(r.status))&&!$('extOcrPanel').hidden&&['売上','仕入'].includes(tab)){
  showStatus(tab==='仕入'?'読み取った伝票は一覧で確認し、「確認済みの伝票をまとめて保存」を押してください。':'読み取ったジャーナルを一覧から確認し、売上の入力欄へ反映してください。','warning');
  $('extBatchRows').scrollIntoView({behavior:'smooth',block:'center'});return;
 }
 if(tab==='仕入'&&extPurchaseMode==='invoice')return extRun(async()=>{
  if(!extInvoice||extInvoice.date!==activeDate)throw Error('仕入れの読み込みが終わるまでお待ちください');
  await extSaveInvoice();day=await rpc('loadDay',activeDate);
 });
 return extOriginalSave();
};
render=function(){
 document.querySelector('.save-actions').hidden=extTabs.includes(tab);
 if(!extTabs.includes(tab))extOriginalRender();
 else {
  document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==tab);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  $('dateLabel').textContent=tab==='AI'?'集計基準日':'日付';
 }
 if(tab==='売上'||tab==='仕入'){
  const kind=tab==='売上'?'journal':'invoice';
  if(extVal('extOcrKind')!==kind||(extOcrDate&&extOcrDate!==activeDate))extResetOcr();
  extSet('extOcrKind',kind);
  $('extOcrHeading').textContent=kind==='journal'?'売上ジャーナルを読み取る':'納品伝票を読み取る';
  $('extOcrSupplierLabel').hidden=kind==='journal';
  $('extInvoiceOcrEngineLabel').hidden=kind==='journal';
  $('extInvoiceCapture').hidden=kind==='journal';
  $(tab==='売上'?'extJournalOcrHost':'extPurchaseOcrHost').append($('extOcrPanel'));
 }
 if(tab==='仕入')extSyncPurchaseMode();
 if(tab==='売上'||tab==='仕入')extRenderReceiptQueue();
 if(tab!=='小口'&&tab!=='入金')extLoadContext().catch(e=>showStatus(e.message,'error'));
};

let extFailureStage='';
function extErrorText(error){
 if(typeof error==='string'&&error.trim())return error;
 if(error&&typeof error.message==='string'&&error.message.trim())return error.message;
 if(error&&typeof error.error==='string'&&error.error.trim())return error.error;
 try{const json=JSON.stringify(error);if(json&&json!=='{}'&&json!=='null')return json.slice(0,1200);}catch(_){}
 return 'エラー詳細を取得できませんでした。Apps Scriptの画面エラーログを確認してください';
}
function extLogClientError(error,stage){
 const message=extErrorText(error);
 console.error('[店舗日報] '+stage+': '+message,error);
 if(window.google&&google.script){
  try{google.script.run.withSuccessHandler(()=>{}).withFailureHandler(e=>console.error('エラーログ送信失敗',e))
   .reportExtensionClientError({stage:String(stage||'画面処理').slice(0,150),message:message.slice(0,1200)});
  }catch(logError){console.error('エラーログ送信失敗',logError);}
 }
 return message;
}
async function extRun(fn,successMessage='処理が完了しました'){
 if(busy)return;extFailureStage='画面処理';setBusy(true);showStatus('処理中…');
 try{await fn();showStatus(successMessage,'success');}
 catch(e){showStatus(extFailureStage+'：'+extLogClientError(e,extFailureStage),'error');}
 finally{setBusy(false);document.querySelector('.save-actions').hidden=extTabs.includes(tab);}
}

function extResetOcr(){
 extOcrApplied=false;extOcrDraft=null;extOcrFiles=[];extUploadCache=[];extOcrDate='';
 $('extUpload').value='';
}
function extOpenOcr(kind){
 if(busy)return;
 if(extVal('extOcrKind')!==kind)extResetOcr();
 extSet('extOcrKind',kind);extOcrDate=activeDate;$('extOcrPanel').hidden=false;
 if(kind==='invoice')extSet('extOcrSupplier',extVal('extSupplier'));
 $('extOcrPanel').scrollIntoView({behavior:'smooth',block:'start'});
}
$('extOpenJournal').onclick=()=>extOpenOcr('journal');
$('extOpenInvoiceOcr').onclick=()=>extOpenOcr('invoice');
$('extCloseOcr').onclick=()=>{$('extOcrPanel').hidden=true;};
$('extSimpleMode').onclick=()=>extSetPurchaseMode('simple');
$('extInvoiceMode').onclick=()=>extSetPurchaseMode('invoice');
$('extPurchaseInvoiceHost').append($('extInvoicePanel'));
function extSelect(el,values,value){el.replaceChildren();values.forEach(x=>{const o=document.createElement('option');o.value=typeof x==='string'?x:x.id;o.textContent=typeof x==='string'?x:x.label;el.append(o);});if(value!=null)el.value=value;}
function extVal(id){return $(id).value;}
function extSet(id,value){$(id).value=value??'';}
function extLink(parent,name,url){if(!/^https:\/\/(?:drive|docs)\.google\.com\//.test(url||''))return;const a=document.createElement('a');a.textContent=name;a.href=url;a.target='_blank';a.rel='noopener';parent.append(a,document.createElement('br'));}
async function extLoadContext(){
 const date=activeDate,result=await rpc('extensionContext',{date});if(date!==activeDate)return;extContext=result;
 extSelect($('extSuppliers'),result.suppliers);
 extSelect($('extProductSelect'),[{id:'',label:'新規登録'},...result.products.map(p=>({id:p.id,label:p.supplier+'／'+p.name}))]);
 extSelect($('extStockProduct'),result.products.map(p=>({id:p.id,label:p.supplier+'／'+p.name})));
 $('extInvoiceList').replaceChildren();
 result.invoices.forEach(i=>{const b=document.createElement('button');b.textContent=i.supplier.name+' '+i.printedTotal+'円 '+(i.status==='cancelled'?'取消':'');b.onclick=()=>{extEditInvoice(i);extPurchaseMode='invoice';extSyncPurchaseMode();};$('extInvoiceList').append(b);});
 if(tab==='仕入'&&(!extInvoice||extInvoice.date!==date))extEditInvoice(extInvoiceDrafts[date]||null);
 if(!$('extStockMonth').value)$('extStockMonth').value=date.slice(0,7);
 if(!$('extTaxMonth').value)$('extTaxMonth').value=date.slice(0,7);
}
function extEditInvoice(invoice){
 extInvoice=invoice?structuredClone(invoice):{id:crypto.randomUUID(),date:activeDate,version:0,lines:[],files:[]};
 const i=extInvoice;
 extSet('extSupplier',i.supplier?.name);extSet('extInvoiceNumber',i.invoiceNumber);extSet('extType',i.type||'delivery');
 extSet('extTaxMode',i.taxMode||'gross');extSet('extTotal',i.printedTotal);extSet('extTax',i.tax);extSet('extAdjustment',i.adjustment||0);extSet('extReason',i.reason);
 $('extLines').replaceChildren();i.lines.forEach(extAddLine);extSyncInvoiceUnits();
 const legacy=[{id:'',label:'新しい伝票'}];extContext?.legacy.forEach(r=>r.items.forEach((item,index)=>legacy.push({id:r.id+'|'+index,label:r.date+' '+item.name+' '+item.amount+'円'})));
 extSelect($('extLegacy'),legacy,i.legacyLink?i.legacyLink.recordId+'|'+i.legacyLink.itemIndex:'');
 $('extInvoiceFiles').replaceChildren();i.files.forEach(f=>extLink($('extInvoiceFiles'),f.name,f.url));extPending=null;extInvoiceDrafts[activeDate]=structuredClone(extInvoice);
}
function extSyncInvoiceUnits(){
 $('extLines').classList.toggle('ext-no-unit',extVal('extSupplier').normalize('NFKC').trim()==='カクヤス');
}
$('extSupplier').addEventListener('input',extSyncInvoiceUnits);
function extAddLine(value={}){
 const line=document.createElement('div');line.className='ext-line';
 const fields=[['name','品名','text'],['sku','商品コード','text'],['qty','数量','number'],['unit','単位','text'],['price','単価','number'],['amount','明細金額','number']];
 const grid=document.createElement('div');grid.className='ext-fields';
 fields.forEach(([key,label,type])=>{const l=document.createElement('label');l.textContent=label;if(key==='unit')l.className='ext-unit-field';const e=document.createElement('input');e.type=type;e.dataset.key=key;e.value=value[key]??'';if(type==='number'){if(!['price','amount'].includes(key))e.min='0';e.step='any';}l.append(e);grid.append(l);});
 for(const [key,label,values] of [['category','分類',['食材','飲料','雑費','容器']],['rate','税率',['','0','8','10']]]){
  const l=document.createElement('label');l.textContent=label;const e=document.createElement('select');e.dataset.key=key;extSelect(e,values,value[key]??(key==='category'?'食材':''));l.append(e);grid.append(l);
 }
 const reason=document.createElement('input');reason.dataset.key='reason';reason.placeholder='金額差の理由';reason.value=value.reason||'';grid.append(reason);
 const remove=document.createElement('button');remove.textContent='× この品目を外す';remove.onclick=()=>line.remove();line.append(grid,remove);$('extLines').append(line);
}
function extInvoiceInput(status){
 const r={id:extInvoice.id,version:extInvoice.version,date:activeDate,supplier:extVal('extSupplier'),invoiceNumber:extVal('extInvoiceNumber'),
 type:extVal('extType'),taxMode:extVal('extTaxMode'),printedTotal:extVal('extTotal'),tax:extVal('extTax'),adjustment:extVal('extAdjustment'),
 reason:extVal('extReason'),status,fileIds:extInvoice.files.map(f=>f.id),lines:[...$('extLines').children].map(el=>Object.fromEntries([...el.querySelectorAll('[data-key]')].map(e=>[e.dataset.key,e.value])))};
 const selected=extVal('extLegacy');
 if(selected){const [recordId,index]=selected.split('|'),record=extContext.legacy.find(r=>r.id===recordId);r.legacyLink={month:activeDate.slice(0,7),recordId,itemIndex:Number(index),fingerprint:JSON.stringify(record.items[Number(index)])};}
 return r;
}
async function extSaveInvoice(status='confirmed'){
 const input=extInvoiceInput(status),fingerprint=JSON.stringify(input);
 if(!extPending||extPending.fingerprint!==fingerprint)extPending={fingerprint,opId:crypto.randomUUID()};
 input.opId=extPending.opId;
 let result=await rpc('saveExtensionInvoice',input);
 if(result.needsDuplicateConfirmation){if(!confirm('同じ仕入先・伝票番号または金額の伝票があります。別の伝票として保存しますか？'))return;input.duplicateConfirmed=true;result=await rpc('saveExtensionInvoice',input);}
 extInvoice=result.invoice;await extLoadContext();extEditInvoice(result.invoice);
}
$('extAddLine').onclick=()=>extAddLine();$('extNewInvoice').onclick=()=>extEditInvoice(null);
$('extCancelInvoice').onclick=()=>{if(extInvoice?.version&&confirm('この伝票だけを取り消します。原本と履歴は残ります。'))extRun(()=>extSaveInvoice('cancelled'));};
$('extSaveTax').onclick=()=>extRun(async()=>{
 const month=extVal('extTaxMonth'),supplier=extVal('extSupplier'),old=extContext.taxes.find(t=>t.month===month&&t.supplier===supplier);
 await rpc('saveExtensionMonthlyTax',{opId:crypto.randomUUID(),version:old?.version||0,month,supplier,foodTax:extVal('extFoodTax'),drinkTax:extVal('extDrinkTax'),miscTax:extVal('extMiscTax'),note:extVal('extTaxNote')});await extLoadContext();
});
$('extProductSelect').onchange=()=>{const p=extContext.products.find(p=>p.id===extVal('extProductSelect'));if(!p)return;
 [['extProductSupplier',p.supplier],['extProductSku',p.sku],['extProductName',p.name],['extProductUnit',p.unit],['extProductAliases',p.aliases.join('、')],['extConversions',JSON.stringify(p.conversions)]].forEach(([id,v])=>extSet(id,v));
};
$('extSaveProduct').onclick=()=>extRun(async()=>{
 const old=extContext.products.find(p=>p.id===extVal('extProductSelect'));
 await rpc('saveExtensionProduct',{opId:crypto.randomUUID(),version:old?.version||0,supplier:extVal('extProductSupplier'),sku:extVal('extProductSku'),name:extVal('extProductName'),unit:extVal('extProductUnit'),aliases:extVal('extProductAliases').split('、').filter(Boolean),conversions:JSON.parse(extVal('extConversions'))});await extLoadContext();
});
function extRenderStock(){
 $('extStockState').textContent=extStock.date+' 時点 ／ '+({draft:'下書き',review:'確認待ち',confirmed:'確定'}[extStock.status])+(extStock.fresh?'':' ／ 要再確認');
 $('extStockState').className=extStock.fresh?'':'ext-warning';
 extSet('extImplementer',extStock.implementer);extSet('extReviewer',extStock.reviewer);$('extStockRows').replaceChildren();
 extStock.rows.forEach(r=>{
  const tr=document.createElement('tr');tr.dataset.id=r.productId;
  const name=document.createElement('td');name.textContent=r.name+'／'+r.supplier+(r.problem?'：'+r.problem:'');tr.append(name);
  for(const key of ['qty','unit','price']){const td=document.createElement('td');if(key==='unit'){td.textContent=r.unit;}else{const e=document.createElement('input');e.type='number';e.min='0';e.step='any';e.dataset.key=key;e.value=r[key]??'';e.setAttribute('aria-label',r.name+(key==='qty'?'数量':'税込単価'));e.readOnly=extStock.status!=='draft'||(key==='price'&&r.priceSource!=='手動'&&r.priceSource!=='');td.append(e);}tr.append(td);}
  $('extStockRows').append(tr);
 });
}
function extStockInput(action){
 return {opId:crypto.randomUUID(),month:extStock.month,version:extStock.version,action,sourceFingerprint:action==='refresh'?extStock.latestFingerprint||extStock.sourceFingerprint:extStock.sourceFingerprint,
  implementer:extVal('extImplementer'),reviewer:extVal('extReviewer'),rows:[...$('extStockRows').children].map(tr=>({productId:tr.dataset.id,qty:tr.querySelector('[data-key="qty"]').value,price:tr.querySelector('[data-key="price"]').value}))};
}
$('extLoadStock').onclick=()=>extRun(async()=>{extStock=await rpc('getExtensionStock',{month:extVal('extStockMonth')});extRenderStock();});
$('extAddStock').onclick=()=>{if(!extStock||extStock.status!=='draft')return;const p=extContext.products.find(p=>p.id===extVal('extStockProduct'));if(!p||extStock.rows.some(r=>r.productId===p.id))return;
 const inputs=extStockInput('draft').rows;extStock.rows.forEach(r=>r.qty=inputs.find(x=>x.productId===r.productId).qty);
 extStock.rows.push({productId:p.id,name:p.name,supplier:p.supplier,unit:p.unit,qty:null,price:null,priceSource:'手動'});extRenderStock();};
document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>extRun(async()=>{
 if(!extStock)throw Error('一覧を表示してください');const action=b.dataset.stock;if(action==='confirm'&&!confirm(extStock.reviewer+'として確認し確定しますか？'))return;
 if(action==='refresh'){
  const latest=await rpc('getExtensionStock',{month:extStock.month}),current=extStockInput(action).rows;
  const rows=latest.latestRows||latest.rows;extStock.rows=rows.map(r=>({...r,qty:current.find(x=>x.productId===r.productId)?.qty??null}));
  current.filter(r=>!rows.some(x=>x.productId===r.productId)).forEach(r=>{const p=extContext.products.find(x=>x.id===r.productId);if(p)extStock.rows.push({...p,productId:p.id,qty:r.qty,price:r.price,priceSource:'手動'});});
  extStock.latestFingerprint=latest.latestFingerprint||latest.sourceFingerprint;
  extRenderStock();
 }
 extStock=await rpc('saveExtensionStock',extStockInput(action));extRenderStock();
}));
/* Receipt review and concurrent OCR are implemented below. */
function extDisplayResults(results){
 $('extAnswer').replaceChildren();
 results.forEach(result=>{

  const title=document.createElement('p');
  title.textContent=result.confirmation||(result.tool==='latestPrices'?'直近の仕入単価（'+result.asOf+'時点）':result.tool==='monthlyTotals'?'伝票合計の月別推移 ／ '+result.supplier+' ／ '+result.asOf+'時点':'品目別の増減 ／ '+result.supplier);
  $('extAnswer').append(title);
  if(result.candidates?.length){const p=document.createElement('p');p.textContent=result.candidates.join('、');$('extAnswer').append(p);}
  if(result.range){const p=document.createElement('p');p.textContent='比較：'+result.range.previous.start+'〜'+result.range.previous.end+' ／ '+result.range.current.start+'〜'+result.range.current.end;$('extAnswer').append(p);}
  const basis={gross:'税込',net:'税抜',monthly:'税抜・月締税'};
  const table=document.createElement('table');table.className='ext-table';
  (result.rows||[]).forEach(r=>{
   const tr=document.createElement('tr'),values=result.tool==='latestPrices'?[r.supplier,r.name,r.date,r.price===null?'単価未入力':r.price+'円／'+r.unit,basis[r.taxBasis]]:
    result.tool==='monthlyTotals'?[r.month,r.total===null?'該当データなし':r.total.toLocaleString()+'円',r.state==='tax_pending'?'税額未確定':r.state==='no_data'?'':'税込合計',r.count+'件']:
    [r.name,'先月 '+r.previous+'円 → 今月 '+r.current+'円','増減 '+(r.increase>0?'+':'')+r.increase+'円',r.unit,basis[r.taxBasis],
      r.quantityIncomplete?'数量未入力あり':'数量 '+r.previousQty+' → '+r.currentQty,
      '平均単価 '+(r.previousUnitPrice??'—')+' → '+(r.currentUnitPrice??'—')];
   values.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td);});table.append(tr);
  });$('extAnswer').append(table);
  if(!result.rows?.length&&!result.confirmation){const p=document.createElement('p');p.textContent='該当データなし';$('extAnswer').append(p);}
  if(result.periodState&&Object.values(result.periodState).includes('no_data')){const p=document.createElement('p');p.textContent='比較期間に未入力の月があります。増減は登録済み明細の範囲です。';p.className='ext-warning';$('extAnswer').append(p);}
  if(result.missingDetails){const p=document.createElement('p');p.className='ext-warning';p.textContent='明細未入力の伝票：'+result.missingDetails+'件。品目の回答には含まれません。';$('extAnswer').append(p);}
  (result.rows||[]).forEach(r=>(r.links||[]).forEach(l=>extLink($('extAnswer'),l.name,l.url)));
 });
}
$('extAsk').onclick=()=>extRun(async()=>{
 const r=await rpc('askExtensionAssistant',{question:extVal('extQuestion'),asOf:activeDate});$('extAiState').textContent=r.answer;$('extAiState').className=r.available?'':'ext-warning';extDisplayResults(r.results);
});
$('extQuery').onclick=()=>extRun(async()=>{const result=await rpc('queryExtensionData',{name:extVal('extQueryName'),args:{supplier:extVal('extQuerySupplier'),item:extVal('extQueryItem')},asOf:activeDate});$('extAiState').textContent='登録済みデータの集計';extDisplayResults([result]);});
['直近のぶりの仕入れ値は？','ここ3か月のキタニ水産の仕入額の推移は？','キタニ水産の3か月推移と、先月より一番増えた品目を教えて'].forEach(q=>{
 const b=document.createElement('button');b.textContent=q;b.onclick=()=>extSet('extQuestion',q);$('extExamples').append(b);
});
extTabs.forEach(t=>{const b=document.createElement('button');b.dataset.tab=t;b.textContent=t==='AI'?'AIアシスタント':t;b.onclick=()=>{capture();tab=t;render();};document.querySelector('nav').append(b);});

window.addEventListener('error',event=>{
 const message=extLogClientError(event.error||event.message,'画面JavaScript');
 showStatus('画面処理：'+message,'error');
});
window.addEventListener('unhandledrejection',event=>{
 const message=extLogClientError(event.reason,'非同期の画面処理');
 showStatus('画面処理：'+message,'error');
});
$('salesSendLine').checked=false;$('depositSendLine').checked=false;

const extReceiptQueue=[];
let extReceiptReviewId='',extReceiptReading=false;
function extReceiptKind(){return extVal('extOcrKind')==='journal'?'journal':'invoice';}
function extReceiptNum(v){return v===''||v==null?null:Number(v);}
function extReceiptValidNumber(v){return v!==null&&v!==''&&v!==undefined&&Number.isFinite(Number(v))&&Number(v)>=0;}
function extReceiptText(parent,text,tag='td'){const el=document.createElement(tag);el.textContent=text;parent.append(el);return el;}
function extReceiptStatuses(status){return ({reading:'読み取り中',ready:'要確認',confirmed:'確認済み',saving:'保存中',saved:'保存済み',failed:'読取失敗',saveFailed:'保存失敗',duplicate:'重複候補',applied:'売上へ反映済み',merged:'まとめ済み'})[status]||status;}
function extReceiptHasNoLines(entry){
 return entry.kind==='invoice'&&entry.status==='ready'&&!entry.draft?.lines?.length;
}
function extRenderReceiptQueue(){
 const kind=extReceiptKind(),rows=extReceiptQueue.filter(r=>r.kind===kind&&r.status!=='merged');
 $('extOcrRotationLabel').hidden=kind==='journal'||extVal('extInvoiceOcrEngine')!=='browser';
 $('extBatchRows').replaceChildren();
 rows.forEach(r=>{
  const tr=document.createElement('tr'),check=extReceiptText(tr,'');
  const box=document.createElement('input');box.type='checkbox';box.checked=!!r.selected;box.disabled=kind!=='invoice'||!['ready','confirmed','duplicate','saveFailed'].includes(r.status);
  box.setAttribute('aria-label','このページをまとめる');box.onchange=()=>r.selected=box.checked;check.append(box);
  extReceiptText(tr,r.uploads.map(u=>u.file.name).join('、'));
  extReceiptText(tr,r.draft?.date||'未取得');extReceiptText(tr,r.draft?.supplier||'未取得');
  extReceiptText(tr,r.draft?.printedTotal??r.draft?.total??'未取得');
  extReceiptText(tr,(r.status==='ready'&&r.draft?.pageCount>1?'全ページを確認':extReceiptHasNoLines(r)?'明細なし':extReceiptStatuses(r.status))+(r.elapsedMs!=null?' ／ '+(r.elapsedMs/1000).toFixed(1)+'秒':'')+(r.engineLabel?' ／ '+r.engineLabel:'')+(r.cached?'（再読取を省略）':'')+(r.error?'：'+r.error:''));
  const cell=extReceiptText(tr,''),button=document.createElement('button');button.type='button';button.textContent=r.status==='saved'?'内容を見る':'確認・修正';

function extBrowserOcrRows(data,useWords=false){
 const lines=(data.blocks||[]).flatMap(block=>block.paragraphs.flatMap(p=>p.lines));
 const fragments=(useWords?lines.flatMap(line=>line.words?.length?line.words:[line]):lines).map(line=>{
  const {x0,y0,y1}=line.bbox;
  return {x:x0,y:(y0+y1)/2,height:y1-y0,text:line.text.trim()};
 }).sort((a,b)=>a.y-b.y);
 if(!fragments.length)return data.text;
 const rows=[];
 for(const fragment of fragments){
  const row=rows.at(-1),first=row?.[0];
  if(first&&Math.abs(first.y-fragment.y)<=Math.min(first.height,fragment.height)*0.45)row.push(fragment);

function extKakuyasuFields(data){
 const words=(data.blocks||[]).flatMap(block=>block.paragraphs.flatMap(p=>p.lines.flatMap(line=>line.words||[])))
  .map(word=>({text:word.text.normalize('NFKC').trim(),...word.bbox})).filter(word=>word.text);
 const center=(word,axis)=>(word[axis+'0']+word[axis+'1'])/2;
 const ordered=[...words].sort((a,b)=>a.x0-b.x0);
 const heading=(label,lower=-Infinity)=>{
  for(const first of ordered){
   if(first.x0<lower||!label.startsWith(first.text))continue;
   const peers=ordered.filter(word=>word.x0>=first.x0&&Math.abs(center(word,'y')-center(first,'y'))<Math.max(5,first.y1-first.y0)*0.65);
   let text='';
   for(const word of peers.slice(0,3)){
    text+=word.text;
    if(text===label)return {...first,x1:word.x1};
    if(!label.startsWith(text))break;
   }
  }
 };
 const loose=heading('バラ数'),price=loose&&heading('単価',loose.x1);
 const name=heading('商品名'),size=name&&heading('規格',name.x1);
 if(!loose||!price||!name||!size||Math.abs(center(loose,'y')-center(price,'y'))>price.y1-price.y0)return [];
 const step=center(price,'x')-center(loose,'x'),priceX=center(price,'x');
 const number=/^\d{1,3}(?:,\d{3})*$|^\d+$/;
 const fields=[];
 for(const word of words){
  const y=center(word,'y'),height=word.y1-word.y0;
  if(height<4||word.y0<price.y1||Math.abs(center(word,'x')-priceX)>step*0.49||!number.test(word.text))continue;
  const amounts=words.filter(next=>center(next,'x')>priceX+step*0.5&&Math.abs(center(next,'y')-y)<=height*0.6&&number.test(next.text));
  const names=ordered.filter(next=>center(next,'x')>name.x0-(size.x0-name.x0)*0.55&&
   center(next,'x')<size.x0&&next.y0>=name.y1&&Math.abs(center(next,'y')-y)<=height*1.2&&/[\p{L}]/u.test(next.text));
  if(amounts.length!==1||!names.length)continue;
  fields.push({name:names.map(next=>next.text).join(' '),price:word.text,amount:amounts[0].text,
   left:Math.max(0,Math.round(priceX-step*1.5)),top:Math.max(0,Math.round(word.y0-height*0.45)),
   right:Math.round(priceX-step*0.5),bottom:Math.round(word.y1+height*0.45)});

}

function extKakuyasuDateOffset(data,width,height){
 const lines=(data.blocks||[]).flatMap(block=>block.paragraphs.flatMap(paragraph=>paragraph.lines));
 const dates=lines.flatMap(line=>(line.words||[]).flatMap(word=>{
  const match=word.text.normalize('NFKC').match(/^(?:20)?(\d{2})\/(\d{1,2})\/(\d{1,2})$/);
  if(!match)return [];
  const [,year,month,day]=match;
  const date=new Date(Date.UTC(2000+Number(year),Number(month)-1,Number(day)));
  if(date.getUTCMonth()+1!==Number(month)||date.getUTCDate()!==Number(day))return [];
  const x=(word.bbox.x0+word.bbox.x1)/2/width,y=(word.bbox.y0+word.bbox.y1)/2/height;
  return x>=0.54&&x<=0.84&&y>=0.19&&y<=0.39?[{x,y,date:date.toISOString()}]:[];
 }));
 if(new Set(dates.map(anchor=>anchor.date)).size!==1)return null;
 const anchor=dates.sort((a,b)=>a.x-b.x)[0];
 return {x:Math.max(-0.10,Math.min(0.10,anchor.x-0.67)),y:Math.max(-0.10,Math.min(0.10,anchor.y-0.28))};
}

function extKakuyasuCleanImage(source){
 const canvas=document.createElement('canvas');
 const width=canvas.width=source.width,height=canvas.height=source.height;
 const context=canvas.getContext('2d',{willReadFrequently:true});
 context.drawImage(source,0,0);
 const image=context.getImageData(0,0,width,height),pixels=image.data;
 const stride=width+1,integral=new Uint32Array(stride*(height+1));
 const gray=new Uint8Array(width*height),ink=new Uint8Array(gray.length);
 for(let y=0;y<height;y++){
  let row=0;
  for(let x=0;x<width;x++){
   const offset=y*width+x,pixel=offset*4;
   gray[offset]=(77*pixels[pixel]+150*pixels[pixel+1]+29*pixels[pixel+2])>>8;
   row+=gray[offset];
   integral[(y+1)*stride+x+1]=integral[y*stride+x+1]+row;
  }
 }
 const radius=Math.max(8,Math.round(width/85));
 for(let y=0;y<height;y++){
  const top=Math.max(0,y-radius),bottom=Math.min(height,y+radius+1);
  for(let x=0;x<width;x++){
   const left=Math.max(0,x-radius),right=Math.min(width,x+radius+1);
   const sum=integral[bottom*stride+right]-integral[top*stride+right]-
    integral[bottom*stride+left]+integral[top*stride+left];
   const background=sum/((right-left)*(bottom-top));
   const offset=y*width+x;
   ink[offset]=gray[offset]+Math.max(12,background*0.10)<background?1:0;
  }
 }
 const lines=new Uint8Array(ink.length);
 // Flag straight rules much longer than text strokes. Use the original mask for both axes.
 for(const [length,count,step,lineStep,minimum] of [
  [width,height,1,width,Math.round(width*0.16)],
  [height,width,width,1,Math.round(height*0.10)]
 ]){
  for(let line=0;line<count;line++){
   const origin=line*lineStep;
   let start=0;
   for(let index=0;index<=length;index++){
    if(index<length&&ink[origin+index*step])continue;
    if(index-start>=minimum){
     for(let run=start;run<index;run++)lines[origin+run*step]=1;
    }
    start=index+1;
   }
  }
 }
 for(let index=0;index<ink.length;index++){
  const value=ink[index]&&!lines[index]?0:255,pixel=index*4;
  pixels[pixel]=pixels[pixel+1]=pixels[pixel+2]=value;

}

function extKakuyasuDeskew(canvas){
 const sample=document.createElement('canvas');
 sample.width=420;
 sample.height=Math.max(1,Math.round(canvas.height*sample.width/canvas.width));
 const context=sample.getContext('2d',{willReadFrequently:true});
 context.drawImage(canvas,0,0,sample.width,sample.height);
 const {width,height}=sample;
 const pixels=context.getImageData(0,0,width,height).data;
 const edges=[];
 // Sharp dark-to-light vertical transitions reveal the table's horizontal rules.
 for(let y=Math.ceil(height*0.30);y<Math.floor(height*0.73);y++){
  for(let x=48;x<width-30;x+=2){
   const offset=(y*width+x)*4,above=offset-width*4;
   const contrast=pixels[offset]+pixels[offset+1]+pixels[offset+2]-pixels[above]-pixels[above+1]-pixels[above+2];
   if(Math.abs(contrast)>165)edges.push([x,y]);
  }
 }
 if(edges.length<100)return 0;
 const score=angle=>{
  const slope=Math.tan(angle*Math.PI/180);
  const bins=new Uint32Array(height+80);
  for(const [x,y] of edges)bins[Math.round(y-(x-width/2)*slope)+40]++;
  return bins.reduce((sum,count)=>sum+count*count,0);
 };
 const straight=score(0);
 let best=straight,angle=0;
 for(let step=-20;step<=20;step++){
  const candidate=step/4,value=score(candidate);
  if(value>best){best=value;angle=candidate;}
 }

}

function extInvoiceOrientationScore(data){
 const compact=data.text.normalize('NFKC').replace(/\s/g,'');
 if(!/[\p{L}\d]/u.test(compact))return -Infinity;
 const labels=['納品書','容器回収票','品名','数量','単位','単価','金額','合計','カクヤス','丸安商店'];
 const matches=labels.filter(label=>compact.includes(label)).length;
 const date=/(?:20)?\d{2}[年/.-]\d{1,2}[月/.-]\d{1,2}/.test(compact);
 return (Number(data.confidence)||0)+matches*12+(date?12:0);
}

async function extReadBrowserInvoice(file,rotation='auto',supplier=''){
 let worker, timer, timedOut=false;
 const read=async()=>{
  const engine=await extLoadTesseract();
  if(timedOut)throw Error('読み取り時間を超えました');
  const loaded=await engine.createWorker('jpn+eng',1,{
   workerPath:EXT_TESSERACT_CDN+'tesseract.js@6.0.1/dist/worker.min.js',
   corePath:EXT_TESSERACT_CDN+'tesseract.js-core@6.0.0/',
   errorHandler(){}

  if(timedOut){await loaded.terminate();throw Error('読み取り時間を超えました');}
  worker=loaded;
  await worker.setParameters({tessedit_pageseg_mode:engine.PSM.SINGLE_BLOCK,preserve_interword_spaces:'1'});
  const image=await createImageBitmap(file);
  const canvas=document.createElement('canvas');
  const angles=rotation==='auto'?[0,-90,90,180]:[Number(rotation)];
  let best=null,crops=null;
  try{
   const scale=Math.min(2800/Math.max(image.width,image.height),2.5);
   const width=Math.max(1,Math.round(image.width*scale));
   const height=Math.max(1,Math.round(image.height*scale));
   const draw=(angle,deskew=0)=>{
    const quarterTurn=Math.abs(angle)===90;
    canvas.width=quarterTurn?height:width;
    canvas.height=quarterTurn?width:height;
    const context=canvas.getContext('2d');
    context.fillStyle='#fff';
    context.fillRect(0,0,canvas.width,canvas.height);
    context.translate(canvas.width/2,canvas.height/2);
    context.rotate((angle+deskew)*Math.PI/180);
    context.drawImage(image,-width/2,-height/2,width,height);
   };
   for(const angle of angles){
    if(timedOut)throw Error('読み取り時間を超えました');
    draw(angle);
    const {data}=await worker.recognize(canvas,{},{text:true,blocks:true});
    const score=extInvoiceOrientationScore(data);
    if(Number.isFinite(score)&&(!best||score>best.score))best={data,score,angle};
   }
   const recognizedText=best?.data.text.normalize('NFKC').replace(/\s/g,'')||'';
   if(best&&(recognizedText.includes('カクヤス')||supplier==='カクヤス')&&!recognizedText.includes('容器回収票')){
    draw(best.angle);
    const deskew=extKakuyasuDeskew(canvas);
    if(deskew)draw(best.angle,deskew);
    const clean=extKakuyasuCleanImage(canvas);
    // Use wide regions to allow for margins and small shifts in smartphone photos.
    const readRegion=async(left,top,right,bottom,alignWords=false)=>{
     const x=Math.floor(canvas.width*left),y=Math.floor(canvas.height*top);
     const rectangle={left:x,top:y,width:Math.floor(canvas.width*right)-x,height:Math.floor(canvas.height*bottom)-y};
     const {data}=await worker.recognize(clean,{rectangle},{text:true,blocks:true});
     return alignWords?data:extBrowserOcrRows(data);
    };
    try{
     await worker.setParameters({tessedit_pageseg_mode:engine.PSM.SPARSE_TEXT});
     const table=await readRegion(0.07,0.24,0.98,0.77,true);
     const items=extBrowserOcrRows(table,true);
     if(!timedOut){
      const offset=extKakuyasuDateOffset(best.data,canvas.width,canvas.height);
      const anchored=offset?await readRegion(0.62+offset.x,0.60+offset.y,
       Math.min(1,0.99+offset.x),Math.min(1,0.96+offset.y)):'';
      const hasTotal=/合[ \t]*計[ \t|]+[¥￥]?[ \t]*[0-9０-９]/.test(anchored.normalize('NFKC'));
      const totals=hasTotal||timedOut?anchored:await readRegion(0.60,0.57,0.99,0.95);

     }
     const candidates=extKakuyasuFields(table);
     if(crops&&candidates.length){
      await worker.setParameters({tessedit_pageseg_mode:engine.PSM.SINGLE_WORD,tessedit_char_whitelist:'0123456789'});
      for(const {name,price,amount,left,top,right,bottom} of candidates){
       if(timedOut)break;
       const rectangle={left,top,width:Math.min(right,canvas.width)-left,height:Math.min(bottom,canvas.height)-top};
       if(rectangle.width<1||rectangle.height<1)continue;
       const {data}=await worker.recognize(clean,{rectangle},{text:true});
       const qty=data.text.trim();
       crops.cells.push({name,price,amount,qty:/^\d+$/.test(qty)?qty:''});
      }
     }
    }catch(_){
     // The full-page recognition remains available when a second pass fails.
    }
   }
  }finally{image.close();}
  if(!best)throw Error('文字を読み取れませんでした');
  return {text:best.data.text,rowText:extBrowserOcrRows(best.data),rotation:best.angle,crops};

  return await Promise.race([read(),new Promise((_,reject)=>{
   timer=setTimeout(()=>{timedOut=true;reject(Error('読み取り時間を超えました'));},120000);
  })]);
 }finally{
  clearTimeout(timer);
  if(worker)await worker.terminate();
 }
}

async function extProcessReceipt(entry){
 const started=Date.now();entry.status='reading';entry.error='';extRenderReceiptQueue();
 try{
  const upload=entry.uploads[0];let result;
  const input={id:upload.id,month:entry.uploadMonth,name:upload.file.name,mime:upload.file.type};
  const browser=entry.kind==='invoice'&&entry.engine==='browser'&&['image/jpeg','image/png'].includes(input.mime);
  if(browser){
   if(!entry.sources.length){
    entry.sources=[await rpc('archiveExtensionDocument',{...input,base64:await extReadFile(upload.file)})];
   }
   let recognized;
   try{recognized=await extReadBrowserInvoice(upload.file,entry.rotation,entry.supplier);}
   catch(_){throw Error('Tesseract.jsでの読み取りに失敗しました。Google Drive OCRに切り替えて再試行できます');}
   const {rotation,...text}=recognized;
   result=await rpc('parseExtensionBrowserInvoice',{...text,fileId:entry.sources[0].id,supplier:entry.supplier});
   const direction={0:'回転なし','-90':'左90°',90:'右90°',180:'180°'}[rotation];
   entry.engineLabel='Tesseract.js'+(direction?'（'+direction+'）':'');
  }else if(entry.sources.length){
   result=await rpc('readExtensionOcr',{fileId:entry.sources[0].id,kind:entry.kind,supplier:entry.supplier});
   entry.engineLabel='Google Drive';
  }else{
   result=await rpc('processExtensionReceipt',{...input,
    base64:await extReadFile(upload.file),kind:entry.kind,supplier:entry.supplier});
   if(result?.source)entry.sources=[result.source];
   if(result?.ok===false)throw Error(result.stage+'：'+result.error);
   entry.engineLabel='Google Drive';
  }
  if(!result||typeof result.text!=='string'||!result.draft||!Array.isArray(result.draft.warnings))throw Error('OCRの返却結果が空または不正です。GASのバージョンを確認してください');
  entry.draft=result.draft;entry.sources=[result.source];entry.texts=[result.text];entry.cached=!!result.timings?.cached;entry.status='ready';
 }catch(error){entry.status='failed';entry.error=extLogClientError(error,'伝票の原本保存・OCR');}
 finally{entry.elapsedMs=Date.now()-started;extRenderReceiptQueue();}
}
async function extReadReceiptEntries(entries){

  await extReceiptPool(entries,async entry=>{
   await extProcessReceipt(entry);completed++;
   $('extBatchProgress').textContent=completed+'／'+entries.length+'件完了 ／ '+((Date.now()-start)/1000).toFixed(1)+'秒。完了した伝票から確認できます。';
   if(entry.status==='ready'&&!(entry.draft?.pageCount>1)&&!$('extReceiptDialog').open&&completed===1&&
     ((tab==='売上'&&entry.kind==='journal')||(tab==='仕入'&&entry.kind==='invoice')))extOpenReceiptReview(entry.id);
  });
  const grouped=extGroupNumberedReceipts(entries);
  if(grouped.length&&tab==='仕入'&&!$('extReceiptDialog').open)extOpenReceiptReview(grouped[0].id);
  const remaining=entries.filter(entry=>entry.status!=='merged').concat(grouped);
  const failed=remaining.filter(r=>r.status==='failed').length;
  const empty=remaining.filter(entry=>extReceiptHasNoLines(entry)&&!(entry.draft?.pageCount>1)).length;
  const pending=remaining.filter(entry=>entry.status==='ready'&&entry.draft?.pageCount>1).length;
  const parts=[(remaining.length-failed-empty-pending)+'件の候補を取得'];
  if(grouped.length)parts.push(grouped.length+'件をページ順にまとめました');
  if(pending)parts.push('ページ未確認 '+pending+'枚');
  if(empty)parts.push('明細なし '+empty+'件');
  if(failed)parts.push('読取失敗 '+failed+'件');
  showStatus('読み取り終了：'+parts.join('、')+'。表で内容を確認してください。',failed||empty||pending?'warning':'success');
 }finally{extReceiptReading=false;extRenderReceiptQueue();}
}

function extGroupNumberedReceipts(readEntries){

  const d=entry.draft;

  if(!groups.has(key))groups.set(key,[]);

  if(!pages.some(page=>readSet.has(page)))continue;

  if(pages.length!==count||numbers.size!==count||pages.some(page=>{
   const d=page.draft;

  }))continue;
  const invoice=extMergeReceiptModels(pages,crypto.randomUUID());

  invoice.draft.warnings.unshift(count+'枚をページ順にまとめました。原本を切り替えて確認できます。');

function extValidateReviewDraft(d,kind){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||Number.isNaN(Date.parse(d.date+'T12:00:00Z'))||new Date(d.date+'T12:00:00Z').toISOString().slice(0,10)!==d.date)throw Error('正しい日付を入力してください');
 if(!extReceiptValidNumber(kind==='journal'?d.total:d.printedTotal))throw Error('印字合計を入力してください。未取得を0円にはしません');
 if(kind==='invoice'){
  if(d.pageCount>1)throw Error('複数ページの伝票です。一覧で全ページを1伝票にまとめてください');
  if(!String(d.supplier||'').trim())throw Error('仕入先を入力してください');
  if(!['gross','net','monthly'].includes(d.taxMode)||!['delivery','return'].includes(d.type))throw Error('種類と税区分を選択してください');
  if(d.taxMode==='net'&&!extReceiptValidNumber(d.tax))throw Error('税別伝票の消費税を入力してください');
  if(!Number.isFinite(d.adjustment))throw Error('調整額を確認してください');
  if(d.requiresQuantityReview&&d.lines.some(line=>line.qty===null))throw Error('数量が空欄の明細があります。原本を見て入力してください');
  const kakuyasu=d.supplier.normalize('NFKC').trim()==='カクヤス';
  d.lines.forEach((l,i)=>{
   const credit=kakuyasu&&d.type==='delivery'&&/廃油回収/.test(l.name)&&Number.isFinite(l.price)&&Number.isFinite(l.amount)&&l.price<0&&l.amount<0;
   if(!String(l.name||'').trim()||(!kakuyasu&&!String(l.unit||'').trim())||(!credit&&!extReceiptValidNumber(l.amount)))throw Error((i+1)+'行目の品名・単位・金額を確認してください');
   if(l.qty!==null&&!extReceiptValidNumber(l.qty)||!credit&&l.price!==null&&!extReceiptValidNumber(l.price))throw Error((i+1)+'行目の数量・単価を確認してください');
   if(credit&&(!l.qty||Math.abs(l.qty*l.price-l.amount)>0.000001))throw Error('廃油回収の数量×単価と明細金額を確認してください');

  if(!d.payments.length||d.payments.some(p=>!PAY.includes(p.name)||!Number.isSafeInteger(p.amount)||p.amount<0))throw Error('決済方法と金額を確認してください');

  if(d.payments.reduce((s,p)=>s+p.amount,0)!==d.total)throw Error('決済方法の合計と印字総売上が一致していません');

 const d=entry.draft;extValidateReviewDraft(d,'invoice');
 const body={id:entry.id,version:entry.version||0,date:d.date,supplier:d.supplier,invoiceNumber:d.invoiceNumber||'',
  type:d.type||'delivery',status:'confirmed',taxMode:d.taxMode,printedTotal:d.printedTotal,tax:d.tax,adjustment:d.adjustment||0,reason:d.reason||'',
  lines:d.lines||[],fileIds:entry.sources.map(s=>s.id)};
 if(entry.duplicateConfirmed)body.duplicateConfirmed=true;
 const fingerprint=JSON.stringify(body);
 if(!entry.request||entry.request.fingerprint!==fingerprint)entry.request={fingerprint,input:{...body,opId:crypto.randomUUID()}};
 return entry.request.input;
}
function extApplyReceiptSaveResults(entries,response){
 if(!response||!Array.isArray(response.results))throw Error('保存結果を受信できませんでした。同じ内容で再試行してください');
 entries.forEach(entry=>{
  const result=response.results.find(r=>r.id===entry.id);
  if(!result){entry.status='saveFailed';entry.error='保存結果がありません。同じ内容で再試行してください';return;}
  if(result.status==='saved'){entry.status='saved';entry.version=result.invoice.version;entry.savedInvoice=result.invoice;entry.error='';}
  else if(result.status==='duplicate'){entry.status='duplicate';entry.candidates=result.candidates;entry.error='重複候補があります。確認・修正から内容を確認してください';}
  else{entry.status='saveFailed';entry.error=result.error||'保存に失敗しました。同じ内容で再試行してください';}
 });
}
$('extSaveBatch').onclick=async()=>{
 if(busy||extReceiptReading){showStatus('読み取りが完了してから保存してください','warning');return;}
 let entries=extReceiptQueue.filter(r=>r.kind==='invoice'&&['confirmed','saveFailed','duplicate'].includes(r.status));
 if(!entries.length){showStatus('一覧から伝票を開き、内容を確認してください','warning');return;}
 try{
  for(const entry of entries){
   if(entry.status==='duplicate'){
    if(!confirm(entry.draft.date+' '+entry.draft.supplier+' は登録済み伝票の候補があります。別の取引として保存しますか？')){entry.status='ready';continue;}
    entry.duplicateConfirmed=true;
   }
  }
  entries=entries.filter(r=>r.status!=='ready');
  if(!entries.length)return;
  const records=entries.map(extReceiptSaveInput);
  // Small save requests keep individual GAS executions bounded. IDs and operation tokens survive transport retries.
  setBusy(true);let saved=0;
  for(let offset=0;offset<entries.length;offset+=2){
   const group=entries.slice(offset,offset+2);group.forEach(r=>{r.status='saving';r.error='';});extRenderReceiptQueue();
   showStatus('伝票を保存中：'+offset+'／'+entries.length);
   try{
    const response=await rpc('saveExtensionReceiptBatch',{records:records.slice(offset,offset+2)});
    extApplyReceiptSaveResults(group,response);
   }catch(error){group.forEach(r=>{r.status='saveFailed';r.error=extLogClientError(error,'伝票の一括保存');});}
   saved+=group.filter(r=>r.status==='saved').length;extRenderReceiptQueue();
  }
  const remaining=entries.length-saved;
  showStatus(saved+'件保存しました'+(remaining?'。'+remaining+'件は未保存です。一覧の理由を確認して再試行してください。':'。各伝票の納品日に記録しています。'),remaining?'warning':'success');
  day=await rpc('loadDay',activeDate);
  await extLoadContext();
 }catch(error){showStatus(extLogClientError(error,'伝票の一括保存'),'error');}
 finally{setBusy(false);extRenderReceiptQueue();}
};

</script>
